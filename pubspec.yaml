name: saloon_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  dotted_decoration: ^2.0.0
  pinput: ^5.0.0
  image_picker: ^1.2.2
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^33.2.3
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  http: ^1.2.0
  get: ^4.7.3
  sensors_plus: ^6.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.10
  table_calendar: ^3.2.0
  cloudinary_public: ^0.23.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications:
  cached_network_image:
  flutter_cache_manager:
  crypto: ^3.0.3
  url_launcher:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: '#A0204A'          # Your exact brand color from your config
  fullscreen: true

  android_12:
    color: '#A0204A'
    # By omitting the 'image' parameter here, Android 12+ will only show
    # the solid background, bypassing any native clipping issues!

flutter:
  uses-material-design: true
  assets:
    - assets/slide1.png
    - assets/slide2.png
    - assets/slide3.png
    - assets/google.png
    - assets/app_icon.png
    - assets/branding_text.png
