name: saloon_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  dotted_decoration: ^2.0.0
  pinput: ^5.0.1
  image_picker: ^1.1.2
  fl_chart: ^0.69.2
  syncfusion_flutter_charts: ^27.2.5
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.2
  get: ^4.6.6
  sensors_plus: ^6.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  table_calendar: ^3.1.3
  cloudinary_public: ^0.23.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^19.5.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: '#A0204A'          # Your exact brand color from your config
  fullscreen: true

  android_12:
    color: '#A0204A'
    # By omitting the 'image' parameter here, Android 12+ will only show
    # the solid background, bypassing any native clipping issues!

flutter:
  uses-material-design: true
  assets:
    - assets/slide1.png
    - assets/slide2.png
    - assets/slide3.png
    - assets/google.png
    - assets/app_icon.png
    - assets/branding_text.png